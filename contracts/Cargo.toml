[workspace]
members = [
    "programs/revenue_router",
    "programs/staking_dividends",
    "programs/referral_system",
    "programs/regna-bridge"
]
resolver = "2"

[workspace.dependencies]
anchor-lang = "=0.29.0"
anchor-spl = "=0.29.0"
solana-program = "=1.17.31"
blake3 = "=1.3.1"
constant_time_eq = "=0.2.6"
indexmap = "=1.9.3"
hashbrown = "=0.13.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
